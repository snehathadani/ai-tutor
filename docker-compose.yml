services:
  redis:
    image: docker.io/redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    env_file: .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    environment:
      - TUTORS_DIR=/app/tutors
    volumes:
      - ${TUTORS_DIR:-./tutors}:/app/tutors:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m agent.worker
    restart: unless-stopped
    env_file: .env
    environment:
      - TUTORS_DIR=/app/tutors
    volumes:
      - ${TUTORS_DIR:-./tutors}:/app/tutors:ro
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  redis-data:
