problems:
  - id: cw-1
    concept_slug: chance-words
    question: If it is cloudy today, is it impossible, unlikely, likely, or certain to rain?
    answer:
      acceptable:
        - unlikely
        - likely
      reason: It depends on the clouds, but rain is usually not certain.
      hint: Think about the difference between a grey cloud and a dark storm cloud. Is rain guaranteed?
  - id: cw-2
    concept_slug: chance-words
    question: Rolling a 7 on a normal 6-sided die is what?
    answer:
      acceptable:
        - impossible
      reason: A standard die only has 1-6.
      hint: What numbers are actually printed on the faces of a standard die?
  - id: ss-1
    concept_slug: sample-space
    question: A spinner is split into red, blue, green, and yellow. How many possible outcomes are there?
    answer:
      acceptable:
        - "4"
        - four
      reason: There are 4 colors.
      hint: Count the different colors the spinner could land on.
  - id: ss-2
    concept_slug: sample-space
    question: You toss a coin and roll a 6-sided die. How many total outcomes are in the sample space?
    answer:
      acceptable:
        - "12"
        - twelve
      reason: 2 times 6 equals 12.
      hint: How many outcomes does the coin have? How many does the die have? Try multiplying them.
  - id: pf-1
    concept_slug: probability-fraction
    question: A bag has 3 red marbles and 5 blue marbles. What fraction of the marbles are red?
    answer:
      acceptable:
        - 3/8
        - 3 / 8
        - three eighths
        - "0.375"
      reason: 3 red out of 8 total.
      hint: What is the total number of marbles? The fraction is the part you want over the whole amount.
  - id: pf-2
    concept_slug: probability-fraction
    question: If P(win) equals 1 out of 4, how would you write that as a fraction?
    answer:
      acceptable:
        - 1/4
        - 1 / 4
        - one quarter
        - one fourth
        - "0.25"
      reason: 1 out of 4 is one quarter.
      hint: Write the number of wins on top and the total tries on the bottom.
  - id: fc-1
    concept_slug: fairness-comparing
    question: Die A has sides 1-6. Die B has sides 1,1,2,2,3,3. Is Die A fair? Is Die B fair?
    answer:
      acceptable:
        - a fair
        - a yes
        - b not fair
        - b no
      reason: Die A has equal chances; Die B repeats numbers.
      hint: A fair die gives each number the same chance. Compare how many times each number appears.
  - id: fc-2
    concept_slug: fairness-comparing
    question: Spinner X has equal red and blue. Spinner Y has 3 red sections and 1 blue. Which spinner gives a better chance of blue?
    answer:
      acceptable:
        - x
        - spinner x
      reason: Spinner X is half blue; Spinner Y is only a quarter blue.
      hint: Compare the fraction of the spinner that is blue in each one.
  - id: et-1
    concept_slug: experiment-vs-theory
    question: If you flip a coin 10 times, theory says half should be heads. If you got 4 heads, is that a surprise?
    answer:
      acceptable:
        - not really
        - a little
        - "no"
        - normal
      reason: Experiments rarely match theory exactly; 4 out of 10 is close to 5.
      hint: Would you expect exactly 5 every single time you flip 10 coins?
  - id: et-2
    concept_slug: experiment-vs-theory
    question: Theoretical probability of rolling a 3 on a die is 1/6. You roll 60 times. About how many 3s do you expect?
    answer:
      acceptable:
        - "10"
        - ten
        - about 10
      reason: 1/6 of 60 is 10.
      hint: What is one sixth of 60?
  - id: ce-1
    concept_slug: complementary-events
    question: The chance of rain is 1/5. What is the chance it does NOT rain?
    answer:
      acceptable:
        - 4/5
        - 4 / 5
        - four fifths
        - "0.8"
      reason: The complement subtracts from 1.
      hint: If the whole is 1, and rain is 1/5, what is left over?
  - id: ce-2
    concept_slug: complementary-events
    question: A spinner lands on green with probability 2/7. What is the probability of NOT green?
    answer:
      acceptable:
        - 5/7
        - 5 / 7
        - five sevenths
      reason: 1 minus 2/7 is 5/7.
      hint: Start from the whole, 7/7, and take away the green part.
  - id: tc-1
    concept_slug: two-coin-events
    question: You flip two coins. List the sample space; what are all the possible outcomes?
    answer:
      acceptable:
        - hh ht th tt
        - hh, ht, th, tt
        - heads heads, heads tails, tails heads, tails tails
      reason: There are four ordered outcomes.
      hint: List the result for the first coin and the second coin together.
  - id: tc-2
    concept_slug: two-coin-events
    question: When flipping two fair coins, what is the probability of getting one head and one tail?
    answer:
      acceptable:
        - 2/4
        - 1/2
        - 2 / 4
        - "0.5"
        - one half
      reason: HT and TH are the two favorable outcomes out of 4.
      hint: How many outcomes have exactly one head and one tail out of all four possible outcomes?
  - id: ev-1
    concept_slug: expected-value
    question: A game gives 3 points half the time and 1 point half the time. What is the average score per play?
    answer:
      acceptable:
        - "2"
        - two
        - 2 points
      reason: Half of 3 plus half of 1 equals 2.
      hint: Average together the two scores, since each happens half the time.
  - id: ev-2
    concept_slug: expected-value
    question: A raffle ticket costs $2. You have a 1 in 100 chance to win $100. On average, do you gain or lose money?
    answer:
      acceptable:
        - lose
        - lose money
      reason: Expected win is $1, but the ticket costs $2.
      hint: What is 1/100 of $100? Compare that to the ticket price.
